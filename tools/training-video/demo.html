<!doctype html><html><head><meta charset="utf-8"><title>SalonOS demo</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}#out{position:fixed;left:-9999px;top:0}iframe{width:100%;height:100%;border:0;display:block}</style></head><body>
<pre id="out">loading</pre>
<script>
// Training-video harness: the real app, offline, with demo data. Hash options (JSON after #):
//   {page:'dashboard'|'salon'|'master-sheet'|'insights'|'users'|'settings'|'reports'|'login', tab:'billing', dark:0,
//    do:[["click","Text"],["wait",500],["type","css",value],["scroll","Text"],["js","code"]], hl:["Text"|"$css",...]}
// After the steps, the rects of the hl targets are written to #out as JSON (read with --dump-dom).
(async function(){
  const out=document.getElementById('out');
  let opt={};try{opt=JSON.parse(decodeURIComponent(location.hash.slice(1))||'{}')}catch(e){out.textContent='bad hash '+e.message;return;}
  window.__opt=opt;
  const html=await (await fetch('../index.html',{cache:'no-store'})).text();
  const styles=[...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/g)].map(m=>m[1]).join('\n');
  const srcs=[...html.matchAll(/<script[^>]*\bsrc="([^"]+)"[^>]*><\/script>/g)].map(m=>m[1]);
  const appFiles=srcs.filter(s=>/^js\//.test(s)), libs=srcs.filter(s=>!/^js\//.test(s));
  let app=(await Promise.all(appFiles.map(u=>fetch('../'+u.split('?')[0],{cache:'no-store'}).then(r=>r.text())))).join('\n');
  app=app.replace('const CLOUD_SYNC_ENABLED=!!(SUPABASE_URL&&SUPABASE_ANON_KEY);','const CLOUD_SYNC_ENABLED=false;')
    .replace("ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App,null));","window.__renderApp=()=>ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App,null));")
    .replace('  const renderPage=()=>{','  window.__app={setActivePage,setSalonTab,setPeriod,setSelFY,setSelectedSalon,salons};\n  const renderPage=()=>{')
    .replace(/<\/script/gi,'<\\/script');
  const data=await (await fetch('demo-data.js',{cache:'no-store'})).text();
  const setup=`(function(){
    const mk=()=>{const m=new Map();return{getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>{m.set(k,String(v))},removeItem:k=>{m.delete(k)},clear:()=>m.clear(),key:i=>[...m.keys()][i]??null,get length(){return m.size}}};
    Object.defineProperty(window,'localStorage',{value:mk(),configurable:true});
    Object.defineProperty(window,'sessionStorage',{value:mk(),configurable:true});
    window.alert=()=>{};window.confirm=()=>true;window.open=()=>null;
    const opt=window.parent.__opt||{};
    if(opt.page!=='login')sessionStorage.setItem('salonos_user',JSON.stringify({id:1,name:'Amit Kumar',email:'owner@glowstudio.in',role:'Super Admin',outletIds:[5,6,7]}));
    localStorage.setItem('salonos_theme',opt.dark?'dark':'light');
    localStorage.setItem('salonos_last_backup_downloaded',new Date().toISOString());
    localStorage.setItem('salonos_secret_backup_downloaded',JSON.stringify(new Date().toISOString()));
  })();`;
  const run=`(async()=>{
    const opt=window.parent.__opt||{};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    try{window.__postSeed&&window.__postSeed();}catch(e){}
    window.__renderApp();await sleep(700);
    const A=window.__app;
    if(A&&opt.page&&opt.page!=='login'){
      if(opt.page==='salon'){const s=A.salons.find(x=>x.id===(opt.outlet||5));A.setPeriod({fy:'2026-27',mi:opt.mi!=null?opt.mi:5});A.setSelFY('2026-27');A.setSelectedSalon(s);A.setActivePage('salon');await sleep(50);A.setSalonTab(opt.tab||'outlet-dashboard');}
      else A.setActivePage(opt.page);
    }
    await sleep(1200);
    document.querySelectorAll('.toast,.toast-container,[class*=toast]').forEach(t=>t.style.display='none');
    const vis=el=>{const r=el.getBoundingClientRect();if(!r.width||!r.height)return false;const cs=getComputedStyle(el);return cs.visibility!=='hidden'&&cs.display!=='none';};
    const find=q=>{
      if(q[0]==='$')return [...document.querySelectorAll(q.slice(1))].find(vis);
      const want=q.toLowerCase();
      const all=[...document.querySelectorAll('button,a,th,td,label,h1,h2,h3,h4,span,div,input,select,option,p,li,strong,b')].filter(vis);
      const exact=all.filter(el=>(el.innerText||el.value||'').trim().toLowerCase()===want);
      const pool=exact.length?exact:all.filter(el=>(el.innerText||'').trim().toLowerCase().includes(want));
      pool.sort((a,b)=>{const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();return ra.width*ra.height-rb.width*rb.height;});
      const pri=pool.find(el=>el.matches('button,a,th,label,input,select'));
      return pri||pool[0];
    };
    for(const st of (opt.do||[])){
      try{
        if(st[0]==='wait')await sleep(st[1]);
        else if(st[0]==='click'){const el=find(st[1]);if(el){el.scrollIntoView({block:'center'});el.click();}else window.__miss=(window.__miss||[]).concat(st[1]);await sleep(st[2]||600);}
        else if(st[0]==='type'){const el=document.querySelector(st[1]);if(el){const set=Object.getOwnPropertyDescriptor(el.tagName==='SELECT'?HTMLSelectElement.prototype:el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype,'value').set;set.call(el,st[2]);el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}await sleep(300);}
        else if(st[0]==='scroll'){const el=find(st[1]);if(el)el.scrollIntoView({block:st[2]||'center'});await sleep(300);}
        else if(st[0]==='js'){await (new Function('find','sleep',st[1]))(find,sleep);await sleep(300);}
      }catch(e){window.__miss=(window.__miss||[]).concat('ERR '+e.message);}
    }
    await sleep(500);
    document.querySelectorAll('.toast,.toast-container,[class*=toast]').forEach(t=>t.style.display='none');
    const rects=(opt.hl||[]).map(q=>{const el=find(q);if(!el)return null;const r=el.getBoundingClientRect();return[Math.round(r.left),Math.round(r.top),Math.round(r.width),Math.round(r.height)];});
    window.parent.document.getElementById('out').textContent=JSON.stringify({rects,miss:window.__miss||[],errs:(window.__errs||[]).slice(0,3),w:innerWidth,h:innerHeight});
  })();`;
  const doc='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="'+location.origin+'/"><style>'+styles+'</style></head><body><div id="root"></div>'
    +'<script>'+setup+'<\/script><script>'+data.replace(/<\/script/gi,'<\\/script')+'<\/script>'+libs.map(s=>'<script src="'+s+'"><\/script>').join('')
    +'<script>'+app+'<\/script><script>setTimeout(()=>{try{'+run+'}catch(e){window.parent.document.getElementById("out").textContent="ERR "+e.message}},1500)<\/script></body></html>';
  const f=document.createElement('iframe');document.body.appendChild(f);f.srcdoc=doc;
})();
</script></body></html>
