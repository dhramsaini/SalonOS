<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>SalonOS self-tests</title>
<style>
  :root{--bg:#F4F7FC;--card:#fff;--text:#0F1B33;--muted:#5E6A82;--ok:#12805C;--bad:#CF3D3D;--border:#D9E1F0}
  @media (prefers-color-scheme: dark){:root{--bg:#0A0E1A;--card:#0F1729;--text:#E8ECF6;--muted:#7C88B0;--ok:#4caf7d;--bad:#ff6b6b;--border:#22304F}}
  body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  p{color:var(--muted);margin:0 0 16px}
  .sum{font-weight:600;margin:12px 0}
  .t{display:flex;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
  .t .s{font-weight:700;width:18px;flex-shrink:0}
  .ok .s{color:var(--ok)} .bad .s{color:var(--bad)}
  .t small{display:block;color:var(--muted);word-break:break-word}
</style>
</head>
<body>
<main>
  <h1>SalonOS self-tests</h1>
  <p>Runs the live app's own calculation code against made-up test data inside a sealed-off frame (its own in-memory storage — your real data and the cloud are never touched).</p>
  <div id="sum" class="sum">Running…</div>
  <div id="out"></div>
</main>
<script>
(async function(){
  const sumEl=document.getElementById('sum'),out=document.getElementById('out');
  try{
    const html=await (await fetch('index.html?t='+Date.now(),{cache:'no-store'})).text();
    const inline=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
    const srcs=[...html.matchAll(/<script[^>]*\bsrc="([^"]+)"[^>]*><\/script>/g)].map(m=>m[1]);
    // App code lives in js/*.js (loaded in order); older single-file builds had it inline.
    const appFiles=srcs.filter(s=>/^js\//.test(s));
    const libs=srcs.filter(s=>!/^js\//.test(s));
    let app=inline.find(s=>s.includes('function swWorkingsFor'));
    if(!app&&appFiles.length)app=(await Promise.all(appFiles.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load '+u);return r.text();})))).join('\n');
    if(!app)throw new Error('Could not find the app script in index.html');
    // The nightly automation check (server code) — compiled and tested inside the frame.
    const automationTs=await (await fetch('supabase/functions/automation/index.ts?t='+Date.now(),{cache:'no-store'})).text();

    // In-memory storage (the frame has no real storage at all) + made-up test data.
    const setup=`(function(){
      const mk=()=>{const m=new Map();return{getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>{m.set(k,String(v))},removeItem:k=>{m.delete(k)},clear:()=>m.clear(),key:i=>[...m.keys()][i]??null,get length(){return m.size}}};
      Object.defineProperty(window,'localStorage',{value:mk(),configurable:true});
      Object.defineProperty(window,'sessionStorage',{value:mk(),configurable:true});
      const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
      put('salonos_salons',[
        {id:901,name:'Test Outlet A',state:'Delhi',status:'Active',pfApplicable:true,esicApplicable:true,ptApplicable:false},
        {id:902,name:'Test Outlet B',state:'Delhi',status:'Active',pfApplicable:false,esicApplicable:false,ptApplicable:false}]);
      const emp=(id,gross,basic,extra)=>Object.assign({id,name:'Emp '+id,desig:'Unisex Hairdresser',dept:'Hairdresser',doj:'2024-01-01',dol:'',weeklyOff:'',status:'Active',gross,basic,hra:0,conv:0,special:0,pf:true,pfOnActualBasic:false,esic:true,pt:false,tds:false},extra||{});
      put('salonos_master_employees_outlet_901',[emp('E1',20000,12000),emp('E2',30000,20000,{pfOnActualBasic:true}),emp('E3',20000,18000)]);
      put('salonos_master_employees_outlet_902',[emp('E4',20000,12000)]);
      const days=(p,a,h)=>[...Array(p).fill('present'),...Array(a).fill('absent'),...Array(h).fill('half')];
      put('salonos_attendance_outlet_901',{E1_2026_8:{days:days(27,3,0)},E2_2026_8:{days:days(28,0,2)},E3_2026_8:{days:days(30,0,0)}});
      put('salonos_attendance_outlet_902',{E4_2026_8:{days:days(30,0,0)}});
    })();`;

    const tests=`(async function(){
      // Login regression test (29 Sep 2026): the Supabase client must be created with this fake
      // server, so fetch is swapped before anything creates it. No real server or password is used.
      const b64=o=>btoa(JSON.stringify(o)).replace(/=+$/,'').replace(/[+]/g,'-').replace(/[/]/g,'_');
      const now=Math.floor(Date.now()/1000);
      const tok=sub=>b64({alg:'HS256',typ:'JWT'})+'.'+b64({sub:sub,role:'authenticated',aud:'authenticated',exp:now+3600,iat:now,aal:'aal1',session_id:'t'})+'.sig';
      const NEW=tok('22222222-2222-2222-2222-222222222222'),OLD=tok('33333333-3333-3333-3333-333333333333');
      const authSeen=[];
      const J=(o,s)=>new Response(JSON.stringify(o),{status:s||200,headers:{'Content-Type':'application/json'}});
      window.fetch=async(url,opts)=>{
        const u=String(url),h=new Headers((opts&&opts.headers)||{});
        if(u.indexOf('grant_type=password')>=0)return J({access_token:NEW,token_type:'bearer',expires_in:3600,expires_at:now+3600,refresh_token:'new-rt',user:{id:'22222222-2222-2222-2222-222222222222',aud:'authenticated',role:'authenticated'}});
        if(u.indexOf('/auth/v1/logout')>=0)return new Response('',{status:204});
        if(u.indexOf('/auth/v1/user')>=0)return J({id:'22222222-2222-2222-2222-222222222222',aud:'authenticated',role:'authenticated'});
        if(u.indexOf('/rest/v1/profiles')>=0){authSeen.push((h.get('Authorization')||'').indexOf(NEW.slice(-30))>=0?'USER':'ANON');return J([]);}
        return J({});
      };
      const results=[];
      const eq=(name,got,want)=>results.push({name,ok:JSON.stringify(got)===JSON.stringify(want),got,want});
      try{
        const A=swWorkingsFor(901,2026,8),B=swWorkingsFor(902,2026,8);
        const f=id=>A.concat(B).find(w=>w.id===id)||{};
        const e1=f('E1'),e2=f('E2'),e3=f('E3'),e4=f('E4');
        eq('Absent days reduce pay: 27 of 30 days payable',[e1.totalDays,e1.daysInMonth],[27,30]);
        eq('Gross for 27/30 days of ₹20,000 = ₹18,000',e1.grossAfterLop,18000);
        eq('PF = 12% of basic ₹12,000 = ₹1,440',e1.pfEmp,1440);
        eq('ESIC = 0.75% of gross ₹20,000 = ₹150',e1.esicEmp,150);
        eq('No PT in Delhi',e1.ptAmt,0);
        eq('Net = 18,000 + 800 tea − 1,440 − 150 = ₹17,210',e1.net,17210);
        eq('Half days count as 0.5: 29 days payable',e2.totalDays,29);
        eq('Gross for 29/30 days of ₹30,000 = ₹29,000',e2.grossAfterLop,29000);
        eq('PF on actual basic ₹20,000 (no cap) = ₹2,400',e2.pfEmp,2400);
        eq('No ESIC above ₹21,000 gross',e2.esicEmp,0);
        eq('Net = 29,000 + 800 − 2,400 = ₹27,400',e2.net,27400);
        eq('PF capped at ₹15,000 wage ceiling = ₹1,800',e3.pfEmp,1800);
        eq('Net = 20,000 + 800 − 1,800 − 150 = ₹18,850',e3.net,18850);
        eq('Outlet with PF off: no PF',e4.pfEmp,0);
        eq('Outlet with ESIC off: no ESIC',e4.esicEmp,0);
        eq('Net with no deductions = 20,000 + 800 = ₹20,800',e4.net,20800);
      }catch(err){results.push({name:'Salary calculation',ok:false,got:String(err&&err.stack||err),want:'no error'});}
      try{
        eq('Amount in words (lakh)',rupeesInWords(123456),'One Lakh Twenty Three Thousand Four Hundred Fifty Six');
        eq('Amount in words (crore)',rupeesInWords(10000001),'One Crore One');
        eq('Amount in words (payslip example)',rupeesInWords(8767),'Eight Thousand Seven Hundred Sixty Seven');
      }catch(err){results.push({name:'Amount in words',ok:false,got:String(err),want:'no error'});}
      try{
        const M=(b,l,s)=>JSON.parse(mergeCloudValues(b==null?null:JSON.stringify(b),JSON.stringify(l),JSON.stringify(s)));
        const ids=a=>a.map(x=>x.id).join(',');
        eq('Merge: two people add different employees → both kept',ids(M([{id:'E1'}],[{id:'E1'},{id:'E2',n:'mine'}],[{id:'E1'},{id:'E3',n:'theirs'}])),'E1,E2,E3');
        eq('Merge: same new ID from two people → second renumbered',M([{id:'E1'}],[{id:'E1'},{id:'E2',n:'mine'}],[{id:'E1'},{id:'E2',n:'theirs'}]).map(x=>x.id+':'+(x.n||'-')).join(','),'E1:-,E2:theirs,E3:mine');
        eq('Merge: an old unchanged copy never deletes others\\' additions',ids(M([{id:'E1'}],[{id:'E1'}],[{id:'E1'},{id:'E2'}])),'E1,E2');
        eq('Merge: different fields edited by two people → both kept',M([{id:'E1',a:1,b:1}],[{id:'E1',a:2,b:1}],[{id:'E1',a:1,b:3}]),[{id:'E1',a:2,b:3}]);
      }catch(err){results.push({name:'Merge logic',ok:false,got:String(err),want:'no error'});}
      try{
        // Another SalonOS tab/window holding an old login on the shared browser storage signs out
        // (what a failed refresh of a revoked login does). This tab's fresh login must survive.
        const c=await getSupabaseClient();
        eq('Login: each tab keeps its own session (not shared browser storage)',[String(c.auth.storageKey).indexOf('salonos-auth-')===0,c.auth.storage===window.sessionStorage],[true,true]);
        const ref=(SUPABASE_URL.match(/https:[/][/]([^.]+)/)||[])[1];
        const sharedKey='sb-'+ref+'-auth-token';
        localStorage.setItem(sharedKey,JSON.stringify({access_token:OLD,token_type:'bearer',expires_in:3600,expires_at:now+3600,refresh_token:'stale-rt',user:{id:'33333333-3333-3333-3333-333333333333'}}));
        const staleTab=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storageKey:sharedKey}});
        const si=await c.auth.signInWithPassword({email:'test@example.com',password:'not-a-real-password'});
        await staleTab.auth.signOut({scope:'local'});
        await new Promise(r=>setTimeout(r,300));
        await c.from('profiles').select('*').eq('id','x');
        eq('Login: another tab signing out does not sign this tab out',[!si.error,authSeen[authSeen.length-1]],[true,'USER']);
      }catch(err){results.push({name:'Login across tabs',ok:false,got:String(err&&err.message||err),want:'no error'});}
      try{
        // A bank statement PDF (made here with jsPDF): header columns, an opening balance, a
        // narration that wraps onto a second line, and a date written as 15-Sep-2026.
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
        const doc=new window.jspdf.jsPDF();doc.setFontSize(9);
        [['Txn Date',10],['Narration',55],['Chq/Ref No',105],['Withdrawal',140,'right'],['Deposit',165,'right'],['Balance',195,'right']].forEach(h=>doc.text(h[0],h[1],24,h[2]?{align:h[2]}:undefined));
        doc.text('Opening Balance',55,30);doc.text('10,000.00',195,30,{align:'right'});
        const R=[['01/09/2026','UPI/CR/1234/CUSTOMER A','UPI111','','1,200.00','11,200.00'],['03/09/2026','NEFT RENT SEPT','N222','5,000.00','','6,200.00'],['15-Sep-2026','CARD SETTLEMENT','S333','','2,345.50','8,545.50']];
        let y=36;R.forEach(r=>{doc.text(r[0],10,y);doc.text(r[1],55,y);doc.text(r[2],105,y);if(r[3])doc.text(r[3],140,y,{align:'right'});if(r[4])doc.text(r[4],165,y,{align:'right'});doc.text(r[5],195,y,{align:'right'});y+=6;if(r[2]==='N222'){doc.text('TO LANDLORD',55,y);y+=6;}});
        const rows=await pdfStatementToRows(new File([doc.output('arraybuffer')],'s.pdf',{type:'application/pdf'}));
        eq('PDF statement: dates, debit/credit, balances',rows.slice(1).map(r=>[r[0],r[4],r[5],r[6]]),[['01/09/2026','',1200,11200],['03/09/2026',5000,'',6200],['15/09/2026','',2345.5,8545.5]]);
        eq('PDF statement: wrapped narration and reference',[rows[2][2],rows[2][3]],['NEFT RENT SEPT TO LANDLORD','N222']);
      }catch(err){results.push({name:'PDF statement',ok:false,got:String(err&&err.message||err),want:'no error'});}
      try{
        // Automation (phase 2): the nightly server check itself — supabase/functions/automation/
        // index.ts, compiled here with TypeScript and run on made-up data for "today" = 5 Oct 2026.
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/typescript/5.4.5/typescript.min.js');
        const js=window.ts.transpileModule(window.__AUTOMATION_TS,{compilerOptions:{module:window.ts.ModuleKind.CommonJS,target:window.ts.ScriptTarget.ES2020}}).outputText;
        const mod={};
        new Function('exports','require','Deno',js)(mod,()=>({createClient:()=>({})}),{env:{get:()=>''},serve:()=>{}});
        const day=(y,m,d)=>Math.floor(Date.UTC(y,m-1,d)/864e5);
        const kv=new Map();
        kv.set('salonos_salons',[{id:901,name:'Test Outlet A — Delhi',status:'Active'},{id:902,name:'Test Outlet B',status:'Active'},{id:903,name:'Closed',status:'Inactive'}]);
        kv.set('salonos_daily_sales_collection_data_outlet_901',{'2026-10-01':{0:500},'2026-10-02':{1:800},'2026-10-03':{0:100}});
        kv.set('salonos_master_employees_outlet_901',[{id:'E1',name:'Asha',status:'Active',weeklyOff:''},{id:'E2',name:'Ravi',status:'Active',weeklyOff:''},{id:'E3',name:'Off Today',status:'Active',weeklyOff:'Monday'},{id:'E9',name:'Old',status:'Left'}]);
        kv.set('salonos_attendance_outlet_901',{E1_2026_9:{days:[,,,,'present']}});
        kv.set('salonos_master_employees_outlet_902',[{id:'E4',name:'Neha',status:'Active',weeklyOff:'',doj:'2026-11-01'}]);
        kv.set('salonos_vendors_outlet_901',[{id:'V1',name:'Loreal'},{id:'V9',name:'BSES'},{id:'V5',name:'Landlord'}]);
        kv.set('salonos_vendor_invoices_outlet_901',[
          {id:'I1',vendorId:'V1',invoiceNo:'A-1',amount:1000,dueDate:'07/10/2026',payments:[]},
          {id:'I2',vendorId:'V1',invoiceNo:'A-2',amount:500,dueDate:'01/10/2026',payments:[{paidAmount:500}]},
          {id:'I3',vendorId:'V1',invoiceNo:'A-3',amount:900,dueDate:'2026-09-30',payments:[{paidAmount:400}]},
          {id:'I4',vendorId:'V1',invoiceNo:'PI-1',amount:700,dueDate:'01/10/2026',docNature:'Performa Invoice',payments:[]},
          {id:'I5',vendorId:'V1',invoiceNo:'A-5',amount:800,dueDate:'20/10/2026',payments:[]},
          {id:'I6',vendorId:'V9',invoiceNo:'E-77',amount:12000,invoiceDate:'10/08/2026',periodFrom:'2026-06',periodTo:'2026-07',payments:[]}]);
        kv.set('salonos_recurring_expenses_outlet_901',[
          {id:'R1',expenseName:'Rent',payee:'Landlord',amount:50000,frequency:'Monthly',dueDay:7,status:'Active',startDate:'2026-01-01',amountType:'Fixed'},
          {id:'R2',expenseName:'Electricity',payee:'BSES',amount:6000,frequency:'Bi-Monthly',dueDay:10,status:'Active',startDate:'2026-06-01',amountType:'Variable',billFor:'previous'},
          {id:'R3',expenseName:'Other',customName:'AMC',payee:'X',amount:9000,frequency:'Quarterly',dueDay:5,status:'Active',startDate:'2026-02-01',amountType:'Fixed'}]);
        const r1=mod.computeAlerts(kv,mod.DEFAULTS,day(2026,10,5));
        const keys=r1.alerts.map(a=>a.akey).sort();
        eq('Automation: which alerts the nightly check raises',keys,['attendance:901:2026-10-05','due:901:I1','due:901:I3','month_end:901:2026-09','recurring:901:R1:2026-10','recurring_bill:901:R2:2026-08','sales:901:2026-10-04']);
        const by=k=>r1.alerts.find(a=>a.akey===k)||{};
        eq('Automation: alert wording and severity',[by('attendance:901:2026-10-05').body,by('due:901:I3').severity,by('due:901:I3').title,by('recurring_bill:901:R2:2026-08').title,by('sales:901:2026-10-04').title],
          ['Ravi','urgent','Test Outlet A: Loreal bill A-3 overdue by 5 days','Test Outlet A: Electricity bill for Aug 2026 – Sep 2026 not entered','Test Outlet A: sales for 4 Oct not entered']);
        eq('Automation: month-end checklist items',by('month_end:901:2026-09').body.split(String.fromCharCode(10)).map(s=>s.split(' (')[0]),['• 30 days without sales','• attendance incomplete for 3 staff','• salary not approved for 3 of 3 staff','• bank statement not imported']);
        const r2=mod.computeAlerts(kv,Object.assign({},mod.DEFAULTS,{autoLock:true,autoLockDay:4}),day(2026,10,5));
        eq('Automation: auto month lock only past the lock day, checklist stops then',[r2.locks,r2.alerts.some(a=>a.kind==='month_end')],[[{sid:901,month:2026*12+8}],false]);
      }catch(err){results.push({name:'Automation checks',ok:false,got:String(err&&err.message||err),want:'no error'});}
      parent.postMessage({salonosTests:results},'*');
    })();`;

    const esc=s=>s.replace(/<\/script>/gi,'<\\/script>');
    const doc='<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><div id="root"></div>'
      +'<script>window.__AUTOMATION_TS='+esc(JSON.stringify(automationTs))+';<\/script>'
      +'<script>'+setup+'<\/script>'
      +libs.map(s=>'<script src="'+s+'"><\/script>').join('')
      +'<script>'+esc(app)+'<\/script>'
      +'<script>'+tests+'<\/script></body></html>';

    const frame=document.createElement('iframe');
    frame.setAttribute('sandbox','allow-scripts');
    frame.style.display='none';
    const timeout=setTimeout(()=>{sumEl.textContent='Tests did not finish (timed out after 60s).';},60000);
    window.addEventListener('message',e=>{
      if(e.source!==frame.contentWindow||!e.data||!e.data.salonosTests)return;
      clearTimeout(timeout);
      const res=e.data.salonosTests;
      const passed=res.filter(r=>r.ok).length;
      sumEl.textContent=(passed===res.length?'✅ ':'❌ ')+passed+' of '+res.length+' tests passed';
      sumEl.style.color=passed===res.length?'var(--ok)':'var(--bad)';
      out.innerHTML='';
      res.forEach(r=>{
        const d=document.createElement('div');d.className='t '+(r.ok?'ok':'bad');
        const s=document.createElement('span');s.className='s';s.textContent=r.ok?'✓':'✗';
        const b=document.createElement('div');b.textContent=r.name;
        if(!r.ok){const sm=document.createElement('small');sm.textContent='expected '+JSON.stringify(r.want)+' · got '+JSON.stringify(r.got);b.appendChild(sm);}
        d.appendChild(s);d.appendChild(b);out.appendChild(d);
      });
      window.__salonosTestResults=res;
    });
    frame.srcdoc=doc;
    document.body.appendChild(frame);
  }catch(err){sumEl.textContent='Could not run tests: '+(err.message||err);}
})();
</script>
</body>
</html>
